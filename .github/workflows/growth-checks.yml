name: Growth OS checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growth-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-release:
    name: Static release validation
    runs-on: ubuntu-latest
    timeout-minutes: 40   # the test list grew past 10 minutes (v1153–v1155) and past 25 minutes (v1208); the runs were cancelled, not failing
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check syntax and release consistency
        run: python3 scripts/check-static-release.py
      - name: Fetch the older versions some tests compare with (v1084 dc5e78b, v1125 6bcf6cd, v1140 main 2d83214, v1155 first SQL b6c507d, v1156 first chat SQL 95f9ff9, v1187 main 893554b, v1189 main d14d444, v1184 first SQL d21250e, v1190 first approval-rules SQL 352dbcc, the second 8b1ddec and v1190 main 29985b6; without them those checks are skipped)
        run: git fetch --no-tags --depth=1 origin dc5e78b3a04a9290de278e7c155354ab63fff8e9 6bcf6cd0b68dacb6b53055cf054c2fdd11ec81fc 2d832147717459643d233a661a85bbcaa68ab2b4 b6c507d5c4f4b0ee2b11e39ccd46e7b12df56ff9 95f9ff95da37a74d6ea178b25db315dc9bc7b9e8 893554bbd3463a9aa285e3780b1f5d47fa672bd2 d14d4447e3299323bbee7b70a9b1282a52dfa2c9 d21250ee4868c51a89c8e2c1f443e6ab437f75a4 352dbcc813b937bc2a077a49cb6fd370d7572ff3 8b1ddeca02ebc91a64a4ef6da896ebce6bb94a0d 29985b63112460fbeb21698e17abe4c347dddc61
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check v1219 App Store review demo entry (production stays the default; the review flag switches the public URL and key; built-in names are emptied; the banner and return button; a switch with unsent data is refused)
        run: node --test tests/review-demo-v1219.test.mjs
      - name: Check v1220 review-demo switch (IndexedDB clears finish before reload; recovery, drafts and unsent invoice images block the switch; the login card has an English label)
        run: node --test tests/review-demo-v1220.test.mjs
      - name: Install the test runtime (fake-indexeddb and PGlite, locked versions)
        run: npm ci --prefix tests/runtime --ignore-scripts --no-audit --no-fund
      - name: Check guarded financial saves with synthetic data
        run: node --test tests/financial-web-*.test.mjs
      - name: Check the save order and the common screen rules (FUNERGY_UX) with synthetic data
        run: node --test tests/ux-core.test.mjs
      - name: Check v1217 service worker (static pages such as /privacy/ and /support/ do not replace the offline copy of the app; the app shell is still cached)
        run: node --test tests/sw-static-nav-v1217.test.mjs
      - name: Check v1136 and v1137 (device-only entries reach the cloud, conditional writes and item-level merge on two devices, a pull keeps unsent edits, the save/sync/diagnosis status and the sent-only "saved" messages) with synthetic data
        run: node --test tests/local-only-sync-v1136.test.mjs tests/local-only-sync-concurrency-v1136.test.mjs tests/save-status-v1137.test.mjs
      - name: Check v1138 (large values live only in IndexedDB, the device storage is freed, interrupted writes and unsent edits come back) with synthetic data
        run: node --test tests/storage-slim-v1138.test.mjs
      - name: Check v1218 links to the privacy policy and support pages inside the app (login screen before sign-in and My Page; Japanese or English page by the app language; public site URLs)
        run: node --test tests/app-privacy-link-v1218.test.mjs
      - name: Check v1139 secure-state (the real handler, the screen code in a VM, the RLS SQL and the checks on PGlite, the deploy files; synthetic data)
        run: node --test tests/secure-state-server.test.mjs tests/secure-state-client.test.mjs tests/secure-state-rls.test.mjs tests/secure-state-deploy.test.mjs
      - name: Check v1140 secure-state Career Score (who sees whom, the write rules, the screen code in a VM with the v1139 function too, the RLS SQL and the checks on PGlite; synthetic data)
        run: node --test tests/secure-cs-server.test.mjs tests/secure-cs-client.test.mjs tests/secure-cs-rls.test.mjs
      - name: Check v1141 settings written only by the decided roles (mileage rate and Score settings; the real handler, the screen code in a VM with the v1140 function too, the write-guard SQL and the checks on PGlite; synthetic data)
        run: node --test tests/secure-settings-server.test.mjs tests/secure-settings-client.test.mjs tests/secure-settings-rls.test.mjs
      - name: Check v1142 hiring and the worry room through secure-state (who sees what, one record at a time, the screen code in a VM, the RLS SQL and the checks on PGlite; synthetic data)
        run: node --test tests/secure-hr-server.test.mjs tests/secure-hr-client.test.mjs tests/secure-hr-rls.test.mjs
      - name: Check v1143 bonus and Career Score settings written only by GM and CEO (the real handler, the screen code and merges in a VM with the v1142 function too, the write-guard SQL and the checks on PGlite; synthetic data)
        run: node --test tests/secure-settings-more-server.test.mjs tests/secure-settings-more-client.test.mjs tests/secure-settings-more-rls.test.mjs
      - name: Check v1144 the employees' personal fields through secure-state (who sees which fields, one person at a time, card matching, store totals, the screen code in a VM with the v1143 function too, the copy-and-strip SQL and the checks on PGlite; synthetic data)
        run: node --test tests/secure-pii-server.test.mjs tests/secure-pii-client.test.mjs tests/secure-pii-rls.test.mjs tests/secure-pii-device.test.mjs tests/wr-people-chef.test.mjs
      - name: Check v1144 the copy-and-strip SQL while other writes overlap (two real PostgreSQL sessions, temporary server, synthetic data; no skipped test)
        run: |
          set -o pipefail
          node --test tests/secure-pii-pg.test.mjs | tee /tmp/pii-pg.txt
          grep -q '^# skipped 0$' /tmp/pii-pg.txt
      - name: Check v1145 the grade history written only by GM and CEO (the real handler, the screen code and merges in a VM with the v1144 and v1142 functions too, the grade-change stops on the employee master / approval / Leader promotion, the write-guard SQL and the checks on PGlite; synthetic data)
        run: node --test tests/secure-grade-hist-server.test.mjs tests/secure-grade-hist-client.test.mjs tests/secure-grade-hist-rls.test.mjs tests/grade-hist-gm-only.test.mjs tests/grade-special.test.mjs tests/ss-refused-drop.test.mjs
      - name: Check v1146 Tip Rate and prep wages written only by the people who decide on today's screens (the real handler, the screen code and merges in a VM with the v1145 function too, the write-guard SQL and the checks on PGlite, the prep and Tip Rate screens; synthetic data)
        run: node --test tests/secure-tip-prep-server.test.mjs tests/secure-tip-prep-client.test.mjs tests/secure-tip-prep-rls.test.mjs tests/prep-matrix-v1106.test.mjs
      - name: Check v1147 tip period confirmations and warning logs only for those who may see / decide them, store scopes from the GM/CEO-confirmed copy (G2 too) and the rename-proof own-Tip-Rate check (the real handler, the screen code and merges in a VM with the v1146 function too, the SQL and the checks on PGlite; synthetic data)
        run: node --test tests/secure-tip-cf-server.test.mjs tests/secure-tip-cf-client.test.mjs tests/secure-tip-cf-rls.test.mjs tests/wr-people-g2.test.mjs tests/secure-state-deploy.test.mjs
      - name: Check v1148 grade history, bonus personal settings and the G3 track read only by those who may see them (the Career Score range; the real handler, the screen code and merges in a VM with the v1147 function too, the SQL and the checks on PGlite; synthetic data)
        run: node --test tests/secure-grade-bonus-read-server.test.mjs tests/secure-grade-bonus-read-client.test.mjs tests/secure-grade-bonus-read-rls.test.mjs tests/secure-grade-hist-server.test.mjs tests/secure-grade-hist-client.test.mjs
      - name: Check v1149 whole-value keys (only this device's changes are put on top of the latest cloud value, unsent changes are kept, a restart before sending on the real storage layer; the real functions in a VM, PGlite and fake-indexeddb; synthetic data)
        run: node --test --test-concurrency=1 tests/merge-whole-v1149.test.mjs tests/merge-whole-restart-v1149.test.mjs
      - name: Check v1150 master tables (stores, ingredients, recipes, categories) send only the rows and fields changed on this device, deleted rows keep a mark and do not come back, conditional writes with a version so a write between read and write is not lost (the real functions in a VM, PGlite; synthetic data)
        run: node --test --test-concurrency=1 tests/master-rows-v1150.test.mjs
      - name: Check v1150 master tables keep unsent changes across a restart when localStorage cannot take the change record (the record goes to IndexedDB; a queue without a record is checked against the cloud by version) (the real storage layer on fake-indexeddb, PGlite; synthetic data)
        run: node --test --test-concurrency=1 tests/master-rows-restart-v1150.test.mjs
      - name: Check v1151 change signal and change log (the SQL watchers, signal and log tables, checks and rollback on PGlite; the secure-state function adds the checked person and reads the log; the real FUNERGY_SIGNAL and ssCall in a VM; synthetic data)
        run: node --test --test-concurrency=1 tests/change-signal-sql.test.mjs tests/change-signal-server.test.mjs tests/change-signal-client.test.mjs
      - name: Check v1152 notifications go through the secure-state function (each person gets only what is addressed to them, adds and own read/ack marks only, the store tablet only adds; the real handler, the app's functions in a VM with the v1151 function too, the SQL and the checks on PGlite; synthetic data)
        run: node --test --test-concurrency=1 tests/secure-notifications-server.test.mjs tests/secure-notifications-client.test.mjs tests/secure-notifications-rls.test.mjs tests/secure-state-deploy.test.mjs
      - name: Check the combined v1141-v1152 deploy bundle (the combined read-only check returns the same rows as each version's check and changes nothing; the procedure names every file; PGlite, synthetic data)
        run: node --test --test-concurrency=1 tests/deploy-all-v1141-v1152.test.mjs
      - name: Check v1153 KPI settings (targets per store and month carry forward and leave earlier months and other stores alone, the meeting's values and thresholds, labor hours without system accounts, the Google month average, focus cards by real role; the app's functions in a VM; synthetic data)
        run: node --test tests/kpi-settings-v1153.test.mjs
      - name: Check v1169 G1 and G2 screens (no Tip Rate history and no floor focus KPI card for G1, G2, the store tablet and office crew; G3, managers and G4 unchanged; the app's functions in a VM; synthetic data)
        run: node --test tests/g1g2-hide-v1169.test.mjs
      - name: Check v1171 upgrade rate breakdown (through yesterday, week over week, days, bowls and orders from the new read-only tables; the SQL on PGlite and the app module in a VM; synthetic data)
        run: node --test tests/upgrade-drill-v1171.test.mjs tests/toast-upgrade-lines-sql.test.mjs
      - name: Check v1172 PC and phone layout (page widths, modal sizes and full-screen modals on phones, the 44px tap areas that stop half way to the next target, 11px text, the store switch, wrapping headers, the Q commit labels that do not overlap, the staff master table and panel on PCs with the same people, permissions and escaping as the cards; the app's functions in a VM; synthetic data)
        run: node --test tests/pcsp-layout-v1172.test.mjs
      - name: Check v1173 labor and attendance on PCs and phones (the store table, the hours split, the staff table and panel, the day list and its table, a full-screen day box on phones, unreadable clock times, one month switch, escaped names and notes; the app's functions in a VM; synthetic data)
        run: node --test tests/labor-ui83-v1173.test.mjs
      - name: Check v1174 the meeting KPI trend for a store with no January to June Excel data (LaLa shows the food and labor cost rows from the accounting PL, stores with Excel data keep their rows, one store statistics call per month) and the read-only SQL for the shared PL copy (months, stores, provisional marks, no amounts; PGlite; synthetic data)
        run: node --test tests/meet-kpi-noseed-v1174.test.mjs tests/pl-public-check-sql.test.mjs
      - name: Check v1175 labor hours per business day (business days from the store calendar, today and closed days left out, days without attendance left out of both sides, closed-day prep hours kept for the period total, system accounts by the per-store Toast ID list, all stores over store-business-days) and the upsell save (HQ sees and saves the store's own setting; saved only after the cloud write; synthetic data)
        run: node --test tests/kpi-hours-day-v1175.test.mjs
      - name: Check v1176 labor hours per business day on screen (days with an invalid time or a missing clock-out are not counted on either side, the earlier monthly target is shown next to the new one, the per-store system account list edited by GM, CEO and the assigned AM, open shifts kept by the import) and the upsell setting in the upgrade rate (the selected modifiers and a la carte, one opportunity counted once, a la carte without an opportunity not counted, from 2026-11 and the start month, days imported before v1176 left out, the same numbers in the KPI, the tile and the breakdown, saved only after the cloud write; the SQL on PGlite and the deploy files; synthetic data)
        run: node --test tests/kpi-hours-upsell-v1176.test.mjs tests/upsell-v1176-sql.test.mjs
      - name: Check v1177 budget, meeting, my page and monthly plan layout on PCs and phones (one KPI tile shape with the corner arrow and keyboard, future days of the current month folded and remembered on this device only, the staff my page in two columns and positions by store in one table on PCs, the monthly plan settings as one metric by store table on PCs, phone charts drawn at the screen width with text of 11px or more, the lunch and dinner summary, the meeting KPI trend name column, the cash tip box text, the close button tap area; the app's functions in a VM; synthetic data)
        run: node --test tests/ui85-v1177.test.mjs
      - name: Check v1178 accounting review, settings, accounting export, diagnostics and monthly summary layout on PCs and phones (the review as one row per document with a side panel on PCs and a one-line list with a full-screen box on phones, 50 per page with the pager, the next unchecked row after approve, return or delete on PCs only, the grade by screen table and approval routing table in settings, the store by store export table using the same buttons and conditions, the diagnostics split in two columns, the phone chart text of 12, one width watcher that waits for open boxes and typing; the app's functions in a VM; synthetic data)
        run: node --test tests/ui86-v1178.test.mjs
      - name: Check v1179 Career Score, talent pipeline, skill by staff, growth manager and OJT admin layout on PCs and phones (one row per person with a side panel on PCs and a one-line list with a full-screen box on phones, 50 per page, the four status counts and grade, store and name filters, the folded org chart remembered on this device, the readiness order, the unsaved skill comment question, the OJT progress order and filter, one OJT chapter at a time with the sticky bar, unsaved-change detection against the saved and opened draft, the leave question, the multiple-choice answer and explanation that were not saved before, the tap areas of the delete buttons and answer circles, the width watcher and the kept positions and inputs across redraws; the app's functions in a VM; synthetic data)
        run: node --test tests/ui87-v1179.test.mjs
      - name: Check the v1180 fix for PR 177 skill comments (a draft comment kept per person on this device only and cleared at logout, so picking another person, the pager, the name search, the store switch and redraws never lose it, the draft mark on the row, a saved or deleted comment refreshing the open phone box so the same text is not sent twice, deleting only the comment that was shown, English labels, the OJT open chapter flag per OJT kind, the growth manager sort counting skills once per person; the app's functions in a VM; synthetic data)
        run: node --test tests/skill-comment-v1180.test.mjs
      - name: Check the v1181 fixes for the PR 173 and 174 notes (upsell boxes changed while a save is waiting stay checked after the redraw as an unsaved draft per store and signed-in person, cleared at logout; the all-store reset and the save share one generation number so an older answer never overwrites the newer state; the system account list waits for another store's save and is only marked done when the list exists on this device, otherwise retry with the reason; separate messages for app starting and settings not loaded yet; the app's functions in a VM; synthetic data)
        run: node --test tests/kpi-p3-v1181.test.mjs
      - name: Check v1182 people screens for UI proposal 88 (onboarding one row per person with tabs for in progress, done, cancelled and applicants, the current card in the right panel or a full-screen box on a phone, Handbook progress 50 per page with filters and a chapter panel, the tip table keeps the header and rows fixed and folds the clocked-in people missing from the split, one day at a time on a phone, the shift builder by weekday tabs on a phone, the responsibility matrices read-only on a phone with a box per task, 44px touch cells for the shift settings; the app's functions in a VM; synthetic data)
        run: node --test tests/hr-ui88-v1182.test.mjs
      - name: Check v1182 food screens for UI proposal 89 (ingredient master 50 per page with a panel, the new master by vendor first, recipes with no ingredients shown as no cost in gray and always last instead of 0.0%, purchase details grouped by day, receipts and reimbursements in separate tabs, the vendor merge folded into one row, the menu item list 50 per page; the app's functions in a VM; synthetic data)
        run: node --test tests/food-ui89-v1182.test.mjs
      - name: Check v1183 new login trial (device-login real SQL on PGlite and real handler with a stand-in PIN check and mark; the app's FUNERGY_DL in a VM signs with a non-extractable key that the server verifies; invite once in 48 hours, 5 devices, 30-day and 90-day rules, logout of this or every device, GM and CEO only by email sign-in, records without secrets; the deploy SQL checks; synthetic data)
        run: node --test --test-concurrency=1 tests/device-login-server.test.mjs tests/device-login-app.test.mjs tests/device-login-deploy.test.mjs
      - name: Check v1185 email and password login for GM, CEO and accounting (device-login email_login on real SQL in PGlite with a stand-in Supabase Auth and mark; the app's FUNERGY_ML in a VM keeps keys and marks in memory only; wrong person, suspended, resigned and permission changes; new-device notices; secure page opened from the app; pay read with the mark; the deploy SQL checks and the stop SQL; synthetic data)
        run: node --test --test-concurrency=1 tests/email-login-server.test.mjs tests/email-login-app.test.mjs tests/email-login-deploy.test.mjs
      - name: Check v1186 GM, CEO and accounting stop PIN login (real SQL in PGlite with v1183 and v1185 first; the switch is off when email login is missing; stop before changing anything when a GM, CEO or accounting person has no linked email account; dl_pin_blocked by employee ID or name and column or data role; login_info for the login screen; accounting leaves the login trial; new-device notices sorted by time before the 500 cap; the deploy SQL checks and the undo SQL; synthetic data)
        run: node --test --test-concurrency=1 tests/pin-off-v1186.test.mjs tests/pin-off-deploy-v1186.test.mjs
      - name: Check v1189 passkey and email-code login (device-login real SQL in PGlite after v1183 to v1186, with a stand-in Supabase Auth, passkey API, Google and Gmail; only the GM sets people and the sender; invite once in 7 days, 6-digit codes, 12-hour login kept only on the person's own device, revoke; people set to passkey no longer pass the PIN; the v1183 trial stops; the app's FUNERGY_PK in a VM with a stand-in WebAuthn; the deploy SQL checks, the sender SQL and the stop SQL; synthetic data)
        run: node --test --test-concurrency=1 tests/passkey-login-server-v1189.test.mjs tests/passkey-login-app-v1189.test.mjs tests/passkey-login-deploy-v1189.test.mjs
      - name: Check v1184 three fixes (the meeting tab shows only the KPIs that are on in KPI settings, with their names, targets and order, a dash for no data and a note when nothing is on or the settings cannot be read; HQ staff by the employee master store are left out of every store's skill matrix and its counts, unknown stores kept and listed; expense rights for office crew and G1 per person by the GM or CEO, checked by the server on every send, logged; the deploy SQL checks; synthetic data)
        run: node --test --test-concurrency=1 tests/three-fixes-v1184.test.mjs tests/wr-exp-grants-v1184.test.mjs tests/three-fixes-deploy-v1184.test.mjs
      - name: Check v1190 approval rules (roles from the accounts and the GM or CEO confirmations, never from the editable employee table alone; the first rules as drafts per the answers; one rule version and route kept per request; a stage is never skipped and a GM does not sign another person's stage; the GM may approve their own request; a person signs a stage once; stuck stages wait for a delegate or an exception; viewers and the CEO, GM, store G4 and accounting visibility; GM bulk approval with per-request results and a resend returning the same result; applying a new version to open requests; going live copies existing approvals; rollback; the deploy SQL checks and the currently deployed function still working on the new SQL; the real PostgREST adapter path, which refused the ar_ names before; the screens (settings, the shape checks matching the server, the preview, a conflict keeping the edit, delegates, going live and off, the route card and exceptions on a request, the bulk approval with one record despite a double press and a resend with the same number); a discarded draft keeps its version so an old screen cannot hit the next draft; an all stage needs a different person for every slot; the screen and bulk results say when a stage still waits for others; real SQL in PGlite and the real handler; synthetic data)
        run: node --test --test-concurrency=1 tests/approval-rules-v1190.test.mjs tests/approval-rules-deploy-v1190.test.mjs tests/approval-rules-postgrest-v1190.test.mjs tests/approval-rules-fixes-v1190.test.mjs tests/approval-rules-ui-v1190.test.mjs tests/approval-rules-pr192-v1190.test.mjs tests/approval-rules-discard-rev-v1190.test.mjs
      - name: Check v1191 one guard for screens (the menu and the destination follow the same rule; G1 store crew only reach the pages in their menu and the pages their screens link to; accounting review folds into the accounting center; the secure page for the CEO and GM only; individual pay and the title pay table for the CEO and GM only; the FUNERGY TIMES link is https on funergygroup.com only, escaped, set by the CEO or GM with a history, saved as one record per save with a conditional write so two devices keep both and "saved" only when it reached the cloud (PR 194); a G1 consultation reply notice opens My Page; per-person tip, shift leader and HQ shift-in amounts and the onboarding Payroll step are not for accounting or Office Crew, totals stay; the real app functions in a VM; synthetic data)
        run: node --test tests/unified-ui-v1191.test.mjs tests/times-sync-v1191.test.mjs tests/pay-detail-v1191.test.mjs
      - name: Check v1192 labor totals from the server (the labor core in secure-state is generated from the page and still matches it; who may read which stores, CEO, GM and accounting all, an AM only the assigned and support stores unless all stores is on, others refused, no names or ids in the answer; the accounting device with the server totals equals the CEO device with every wage, to the cent, for the month, each week, each day, lunch and dinner, salaries and the grade split, on UTC, Japan and Hawaii devices; an older function, no session, refusal, network failure, a missing answer, stores outside the scope, a login change, manual attendance fixes and logout; the contacts-only pay save; the one-file function for the Supabase editor is built from the sources, parses, answers like the module and the v1152 rollback file is unchanged; the real handler and the page functions in a VM; synthetic data. For PR 195, an AM opens every store only through the GM and CEO copy md_all_viewers_gm, which the public keys cannot write (the SQL, its checks and rollback on PGlite, the function, the app routing and the old-function fallback); the attendance window does not change with which months are asked; tables are read page by page; the SQL files in the deploy folder are copies of the sources)
        run: node scripts/build-labor-core.mjs --check && node scripts/build-secure-state-one.mjs --check && node --test --test-concurrency=1 tests/labor-totals-v1192.test.mjs tests/labor-totals-deploy-v1192.test.mjs tests/md-all-viewers-gm-v1192.test.mjs tests/md-all-viewers-gm-client-v1192.test.mjs
      - name: Check v1193 page view settings (the screen settings document and its change log, which the public keys cannot read or write; the save function with a version check, a conflict that keeps nothing, the same document kept as is, stop, resume and rollback; only the CEO and GM in office read the whole document or save it, everyone else gets only their own column, their own person exceptions and the staff-only pages; the one-file function is built from the sources and answers like the module; the SQL files in the deploy folder are copies; real SQL in PGlite and the real handler; synthetic data)
        run: node --test --test-concurrency=1 tests/page-view-server-v1193.test.mjs tests/page-view-deploy-v1193.test.mjs
      - name: Check v1193 page view settings in the app (each person goes to the right column; the starting values equal what every grade and role sees today, plus the 16 pages and KPI settings for accounting and office; saving them changes nobody else's menu; the order fixed, selected staff only, person, grade or role; pages beyond today's role rules are view only, a band, and synced saves and server saves pressed on that screen are refused while background and device-only writes are not; G1 can only hide its own groups; store master stays closed to office crew by the code guard; an old function, missing SQL, turned off, a network failure, another sign-in and sign-out keep today's rules; the real nav and module in a VM; synthetic data)
        run: node --test --test-concurrency=1 tests/page-view-app-v1193.test.mjs
      - name: Check v1193 view-only screens stop ordinary typing (PR 197; any key, input, paste, cut, drop, composing, leaving the field and a save up to 1.5 seconds later are presses on the screen, so the inventory count, a server save and a daily input on a view-only screen are not saved and the field shows its value again; the same typing saves where the screen is editable and background writes still run; every v1101 writer a person presses is wrapped, deletes, approve, reject and reopen too, the automatic ones are not; the staff master and KPI settings are not given to office crew, whose screens refuse them; the real module, the real lsSet guard and the real setInvCount in a VM with browser-like event order; synthetic data)
        run: node --test --test-concurrency=1 tests/page-view-input-v1193.test.mjs
