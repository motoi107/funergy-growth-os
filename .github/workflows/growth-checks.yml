name: Growth OS checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growth-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-release:
    name: Static release validation
    runs-on: ubuntu-latest
    timeout-minutes: 25   # the test list grew past 10 minutes (v1153–v1155); the runs were cancelled, not failing
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check syntax and release consistency
        run: python3 scripts/check-static-release.py
      - name: Fetch the older versions some tests compare with (v1084 dc5e78b, v1125 6bcf6cd, v1140 main 2d83214, v1155 first SQL b6c507d; without them those checks are skipped)
        run: git fetch --no-tags --depth=1 origin dc5e78b3a04a9290de278e7c155354ab63fff8e9 6bcf6cd0b68dacb6b53055cf054c2fdd11ec81fc 2d832147717459643d233a661a85bbcaa68ab2b4 b6c507d5c4f4b0ee2b11e39ccd46e7b12df56ff9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install the test runtime (fake-indexeddb and PGlite, locked versions)
        run: npm ci --prefix tests/runtime --ignore-scripts --no-audit --no-fund
      - name: Check guarded financial saves with synthetic data
        run: node --test tests/financial-web-*.test.mjs
      - name: Check the save order and the common screen rules (FUNERGY_UX) with synthetic data
        run: node --test tests/ux-core.test.mjs
      - name: Check v1136 and v1137 (device-only entries reach the cloud, conditional writes and item-level merge on two devices, a pull keeps unsent edits, the save/sync/diagnosis status and the sent-only "saved" messages) with synthetic data
        run: node --test tests/local-only-sync-v1136.test.mjs tests/local-only-sync-concurrency-v1136.test.mjs tests/save-status-v1137.test.mjs
      - name: Check v1138 (large values live only in IndexedDB, the device storage is freed, interrupted writes and unsent edits come back) with synthetic data
        run: node --test tests/storage-slim-v1138.test.mjs
      - name: Check v1139 secure-state (the real handler, the screen code in a VM, the RLS SQL and the checks on PGlite, the deploy files; synthetic data)
        run: node --test tests/secure-state-server.test.mjs tests/secure-state-client.test.mjs tests/secure-state-rls.test.mjs tests/secure-state-deploy.test.mjs
      - name: Check v1140 secure-state Career Score (who sees whom, the write rules, the screen code in a VM with the v1139 function too, the RLS SQL and the checks on PGlite; synthetic data)
        run: node --test tests/secure-cs-server.test.mjs tests/secure-cs-client.test.mjs tests/secure-cs-rls.test.mjs
      - name: Check v1141 settings written only by the decided roles (mileage rate and Score settings; the real handler, the screen code in a VM with the v1140 function too, the write-guard SQL and the checks on PGlite; synthetic data)
        run: node --test tests/secure-settings-server.test.mjs tests/secure-settings-client.test.mjs tests/secure-settings-rls.test.mjs
      - name: Check v1142 hiring and the worry room through secure-state (who sees what, one record at a time, the screen code in a VM, the RLS SQL and the checks on PGlite; synthetic data)
        run: node --test tests/secure-hr-server.test.mjs tests/secure-hr-client.test.mjs tests/secure-hr-rls.test.mjs
      - name: Check v1143 bonus and Career Score settings written only by GM and CEO (the real handler, the screen code and merges in a VM with the v1142 function too, the write-guard SQL and the checks on PGlite; synthetic data)
        run: node --test tests/secure-settings-more-server.test.mjs tests/secure-settings-more-client.test.mjs tests/secure-settings-more-rls.test.mjs
      - name: Check v1144 the employees' personal fields through secure-state (who sees which fields, one person at a time, card matching, store totals, the screen code in a VM with the v1143 function too, the copy-and-strip SQL and the checks on PGlite; synthetic data)
        run: node --test tests/secure-pii-server.test.mjs tests/secure-pii-client.test.mjs tests/secure-pii-rls.test.mjs tests/secure-pii-device.test.mjs tests/wr-people-chef.test.mjs
      - name: Check v1144 the copy-and-strip SQL while other writes overlap (two real PostgreSQL sessions, temporary server, synthetic data; no skipped test)
        run: |
          set -o pipefail
          node --test tests/secure-pii-pg.test.mjs | tee /tmp/pii-pg.txt
          grep -q '^# skipped 0$' /tmp/pii-pg.txt
      - name: Check v1145 the grade history written only by GM and CEO (the real handler, the screen code and merges in a VM with the v1144 and v1142 functions too, the grade-change stops on the employee master / approval / Leader promotion, the write-guard SQL and the checks on PGlite; synthetic data)
        run: node --test tests/secure-grade-hist-server.test.mjs tests/secure-grade-hist-client.test.mjs tests/secure-grade-hist-rls.test.mjs tests/grade-hist-gm-only.test.mjs tests/grade-special.test.mjs tests/ss-refused-drop.test.mjs
      - name: Check v1146 Tip Rate and prep wages written only by the people who decide on today's screens (the real handler, the screen code and merges in a VM with the v1145 function too, the write-guard SQL and the checks on PGlite, the prep and Tip Rate screens; synthetic data)
        run: node --test tests/secure-tip-prep-server.test.mjs tests/secure-tip-prep-client.test.mjs tests/secure-tip-prep-rls.test.mjs tests/prep-matrix-v1106.test.mjs
      - name: Check v1147 tip period confirmations and warning logs only for those who may see / decide them, store scopes from the GM/CEO-confirmed copy (G2 too) and the rename-proof own-Tip-Rate check (the real handler, the screen code and merges in a VM with the v1146 function too, the SQL and the checks on PGlite; synthetic data)
        run: node --test tests/secure-tip-cf-server.test.mjs tests/secure-tip-cf-client.test.mjs tests/secure-tip-cf-rls.test.mjs tests/wr-people-g2.test.mjs tests/secure-state-deploy.test.mjs
      - name: Check v1148 grade history, bonus personal settings and the G3 track read only by those who may see them (the Career Score range; the real handler, the screen code and merges in a VM with the v1147 function too, the SQL and the checks on PGlite; synthetic data)
        run: node --test tests/secure-grade-bonus-read-server.test.mjs tests/secure-grade-bonus-read-client.test.mjs tests/secure-grade-bonus-read-rls.test.mjs tests/secure-grade-hist-server.test.mjs tests/secure-grade-hist-client.test.mjs
      - name: Check v1149 whole-value keys (only this device's changes are put on top of the latest cloud value, unsent changes are kept, a restart before sending on the real storage layer; the real functions in a VM, PGlite and fake-indexeddb; synthetic data)
        run: node --test --test-concurrency=1 tests/merge-whole-v1149.test.mjs tests/merge-whole-restart-v1149.test.mjs
      - name: Check v1150 master tables (stores, ingredients, recipes, categories) send only the rows and fields changed on this device, deleted rows keep a mark and do not come back, conditional writes with a version so a write between read and write is not lost (the real functions in a VM, PGlite; synthetic data)
        run: node --test --test-concurrency=1 tests/master-rows-v1150.test.mjs
      - name: Check v1150 master tables keep unsent changes across a restart when localStorage cannot take the change record (the record goes to IndexedDB; a queue without a record is checked against the cloud by version) (the real storage layer on fake-indexeddb, PGlite; synthetic data)
        run: node --test --test-concurrency=1 tests/master-rows-restart-v1150.test.mjs
      - name: Check v1151 change signal and change log (the SQL watchers, signal and log tables, checks and rollback on PGlite; the secure-state function adds the checked person and reads the log; the real FUNERGY_SIGNAL and ssCall in a VM; synthetic data)
        run: node --test --test-concurrency=1 tests/change-signal-sql.test.mjs tests/change-signal-server.test.mjs tests/change-signal-client.test.mjs
      - name: Check v1152 notifications go through the secure-state function (each person gets only what is addressed to them, adds and own read/ack marks only, the store tablet only adds; the real handler, the app's functions in a VM with the v1151 function too, the SQL and the checks on PGlite; synthetic data)
        run: node --test --test-concurrency=1 tests/secure-notifications-server.test.mjs tests/secure-notifications-client.test.mjs tests/secure-notifications-rls.test.mjs tests/secure-state-deploy.test.mjs
      - name: Check the combined v1141-v1152 deploy bundle (the combined read-only check returns the same rows as each version's check and changes nothing; the procedure names every file; PGlite, synthetic data)
        run: node --test --test-concurrency=1 tests/deploy-all-v1141-v1152.test.mjs
      - name: Check v1153 KPI settings (targets per store and month carry forward and leave earlier months and other stores alone, the meeting's values and thresholds, labor hours without system accounts, the Google month average, focus cards by real role; the app's functions in a VM; synthetic data)
        run: node --test tests/kpi-settings-v1153.test.mjs
      - name: Check v1154 Workcenter bulk approval (only the three expense kinds a person can approve, sent with the version that was seen; a request changed or handled meanwhile is not approved; filters clear the selection; one approval per request; the accounting review list; the real screen module with the real handler and SQL in PGlite; synthetic data)
        run: node --test tests/wc-bulk-v1154.test.mjs
      - name: Check v1155 Workcenter stage 2 (budgets and the old approval tab kinds as one-number requests; AM then GM, the GM approves any step and the rest is recorded; budget versions; apply once; accounting checks; the bridge from the old screens, the bulk approval with budgets, the old buttons stop; the real SQL on PGlite, the real handler, the screen in a VM, the deploy files; synthetic data)
        run: node --test --test-concurrency=1 tests/work-requests-stage2-server.test.mjs tests/wc-stage2-v1155.test.mjs tests/work-requests-stage2-deploy.test.mjs
      - name: Check the read-only approvals inventory SQL (old approval kinds counted by type and state, the saved routing, no names, titles or amounts; PGlite, synthetic data)
        run: node --test tests/approvals-inventory-sql.test.mjs
      - name: Check the v1140 app (main 2d83214) still works with the v1152 secure-state function (step A of the combined procedure; the v1140 app's own client tests against the new function; synthetic data)
        run: |
          set -o pipefail
          node --test --test-concurrency=1 tests/compat-v1140-app.test.mjs | tee /tmp/compat-1140.txt
          grep -q '^# skipped 0$' /tmp/compat-1140.txt
      - name: Check the same-name SQL (read-only check, and the rename of a retired duplicate record and its undo under the resign guard and the change log; PGlite, synthetic data)
        run: node --test tests/cs-same-name-sql.test.mjs tests/employee-dup-rename.test.mjs
      - name: Check v1129 and v1130 (Tip Rate start date, menu names and visit types, store switching, repeat rate state and breakdown, LaLa read-only SQL) with synthetic data
        run: node --test tests/tip-start-date.test.mjs tests/tip-weight-rate.test.mjs tests/tip-rate-live.test.mjs tests/menu-ui65.test.mjs tests/menu-visit-exclude.test.mjs tests/menu-names-sql.test.mjs tests/store-switch-v1129.test.mjs tests/repeat-rate-v1129.test.mjs tests/lala-menu-repeat-sql.test.mjs tests/repeat-vt-v1130.test.mjs tests/lala-visit-diag-sql.test.mjs tests/lala-visit-diag2-sql.test.mjs tests/lala-visit-after-sql.test.mjs
      - name: Check v1131 work requests (real SQL on PGlite, real handler, the screen module in a VM, the deploy files; synthetic data)
        run: node --test tests/work-requests-server.test.mjs tests/work-requests-ui.test.mjs tests/work-requests-deploy.test.mjs
      - name: Check v1132 evaluation change requests and the skill matrix view (real SQL on PGlite, real handler, the screen module in a VM, the deploy files; synthetic data)
        run: node --test tests/work-requests-eval-server.test.mjs tests/work-requests-eval-ui.test.mjs tests/work-requests-eval-deploy.test.mjs
      - name: Check v1133 apply claims (the Codex #124 scenarios on the real SQL and handler, the screen module in a VM; synthetic data)
        run: node --test tests/work-requests-apply-claim.test.mjs
      - name: Check v1135 UI案68 answers (mileage to the GM, G3 and AM asks, OJT passes through the GM, one store view set by the GM; real SQL on PGlite, real handler; synthetic data)
        run: node --test tests/work-requests-ui68-server.test.mjs tests/work-requests-ui68-app.test.mjs
      - name: Check v1133 apply claims with two real PostgreSQL sessions (temporary server, synthetic data; no skipped test)
        run: |
          set -o pipefail
          node --test tests/review/pr124-wr-apply-claim-race.test.mjs | tee /tmp/wr-claim-race.txt
          grep -q '^# skipped 0$' /tmp/wr-claim-race.txt
      - name: Check the v1131 duplicate lock with two real PostgreSQL sessions (temporary server, synthetic data; no skipped test)
        run: |
          set -o pipefail
          node --test tests/review/pr123-wr-dup-race.test.mjs | tee /tmp/wr-race.txt
          grep -q '^# skipped 0$' /tmp/wr-race.txt
      - name: Check the item linking screen against the real intake handler and SQL (PGlite, synthetic data)
        run: node --test tests/invoice-item-link-ui.test.mjs
      - name: Check the resignation sync and the send queue (two devices, PGlite, synthetic staff; no skipped test)
        run: |
          set -o pipefail
          node --test tests/employee-resign-sync.test.mjs | tee /tmp/resign.txt
          grep -q '^# skipped 0$' /tmp/resign.txt

  item-link-guards:
    name: Item linking screen guards (each protection removed must fail a test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install the test runtime (PGlite, locked versions)
        run: npm ci --prefix tests/runtime --ignore-scripts --no-audit --no-fund
      - name: Remove each guard of the linking screen one at a time
        env:
          INVOICE_MUTATION_ONLY: '紐づけ app'
        run: node --test tests/invoice-mutations.test.mjs
